databaseChangeLog:
  - changeSet:
      id: db.changelog-043-hack-day-sign-up-cut-1
      author: ceesjansen
      comment: >-
        Holiday or sickness on a hack day cuts the person's sign-up to the hours they were there.
        The hours they originally signed up for are kept here, so the sign-up comes back when
        the absence is deleted or rejected.
      changes:
        - createTable:
            tableName: hack_day_sign_up_cut
            columns:
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: hack_day_sign_up_cutPK
                    foreignKeyName: hack_day_sign_up_cut_event_fk
                    references: event(id)
                    deleteCascade: true
              - column:
                  name: person_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: hack_day_sign_up_cutPK
                    foreignKeyName: hack_day_sign_up_cut_person_fk
                    references: person(id)
                    deleteCascade: true
              - column:
                  name: hours
                  type: DOUBLE
                  constraints:
                    nullable: false
