databaseChangeLog:
  - changeSet:
      id: db.changelog-037-laptop-1
      author: willemveelenturf
      comment: >-
        Register company laptops. A laptop has a name and a unique serial number,
        can optionally be handed out to a person (person_id) and tracks whether
        that person signed the laptop contract (contract_signed).
      changes:
        - createTable:
            tableName: laptop
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: laptopPK
              - column:
                  name: code
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: laptop_code_unique
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: serial_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: laptop_serial_number_unique
              - column:
                  name: contract_signed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: person_id
                  type: BIGINT
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseColumnNames: person_id
            baseTableName: laptop
            constraintName: FK_laptop_person
            deferrable: false
            initiallyDeferred: false
            referencedColumnNames: id
            referencedTableName: person
            validate: true
        - createIndex:
            indexName: laptop_person_id_index
            tableName: laptop
            columns:
              - column:
                  name: person_id
  - changeSet:
      id: db.changelog-037-laptop-2
      author: willemveelenturf
      comment: Hibernate 6 entity-specific sequence for laptop ids (see db.changelog-026).
      changes:
        - createSequence:
            sequenceName: laptop_seq
            startValue: 1
            incrementBy: 50
  - changeSet:
      id: db.changelog-037-laptop-3
      author: willemveelenturf
      comment: The day the laptop was bought. Optional, because it is not always known for older devices.
      changes:
        - addColumn:
            tableName: laptop
            columns:
              - column:
                  name: purchase_date
                  type: DATE
  - changeSet:
      id: db.changelog-037-laptop-4
      author: willemveelenturf
      comment: >-
        Hand the new LaptopAuthority.* to everybody who can already manage all persons
        (PersonAuthority.ADMIN), so laptops can be registered right after the deploy
        without touching every admin user by hand. Idempotent: users that already have
        an authority are skipped.
      changes:
        - sql:
            sql: |
              INSERT INTO user_authorities (user_id, authorities)
              SELECT DISTINCT ua.user_id, 'LaptopAuthority.READ'
              FROM user_authorities ua
              WHERE ua.authorities = 'PersonAuthority.ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM user_authorities x
                  WHERE x.user_id = ua.user_id AND x.authorities = 'LaptopAuthority.READ'
                );
              INSERT INTO user_authorities (user_id, authorities)
              SELECT DISTINCT ua.user_id, 'LaptopAuthority.WRITE'
              FROM user_authorities ua
              WHERE ua.authorities = 'PersonAuthority.ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM user_authorities x
                  WHERE x.user_id = ua.user_id AND x.authorities = 'LaptopAuthority.WRITE'
                );
              INSERT INTO user_authorities (user_id, authorities)
              SELECT DISTINCT ua.user_id, 'LaptopAuthority.ADMIN'
              FROM user_authorities ua
              WHERE ua.authorities = 'PersonAuthority.ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM user_authorities x
                  WHERE x.user_id = ua.user_id AND x.authorities = 'LaptopAuthority.ADMIN'
                );
