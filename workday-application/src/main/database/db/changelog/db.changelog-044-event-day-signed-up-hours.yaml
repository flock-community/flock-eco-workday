databaseChangeLog:
  - changeSet:
      id: db.changelog-044-event-day-signed-up-hours-1
      author: ceesjansen
      comment: >-
        Holiday or sickness on a hack day cuts the person's sign-up to the hours they were there
        (0 when they missed the whole day). The hours they originally signed up for are kept
        here, so the sign-up comes back when the absence is deleted or rejected.
      changes:
        - addColumn:
            tableName: event_day
            columns:
              - column:
                  name: signed_up_hours
                  type: DOUBLE
