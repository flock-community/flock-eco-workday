flock.eco.cloud.stub.enabled=true
flock.eco.workday.google.enabled=false
flock.eco.workday.bucket.documents=test-bucket
flock.eco.workday.calendar.token=sesamstraat
google.drive.sheets.workday.templateId=none
# Enable me if you want to see SQL queries
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.springframework.security=DEBUG

spring.cloud.gcp.sql.enabled=false
spring.cloud.gcp.storage.enabled=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.password=
spring.sql.init.platform=h2
spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.liquibase.enabled=false
spring.session.store-type=none
# Tests run without a reachable Hydra. Disable both the auto-config (which would try
# to fetch /.well-known/openid-configuration at startup) and clear the issuer URI so
# our ConditionalOnProperty-guarded JWT beans skip wiring. WebSecurityConfig also
# guards the .oauth2ResourceServer call on the converter being present.
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
workday.average_holi_days=25
workday.average_public_days=9
workday.average_sick_days=5
workday.average_training_days=5
